name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew projects --console=plain
      - run: bash gradlew :1.20.1:forge:build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            **/build/libs/*.jar
